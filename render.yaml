services:
  - type: web
    name: jeci
    runtime: node
    plan: free # passez à "starter" plus tard (dashboard Render) pour un service toujours actif
    region: frankfurt # rapprochez-le de votre cluster TiDB si possible
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    # preDeployCommand nécessite un plan payant (starter ou plus) : sur le
    # plan free, elle est retirée. Lancez "npm run db:push" depuis votre
    # machine (DATABASE_URL pointant vers TiDB) avant chaque déploiement qui
    # modifie le schéma — voir l'étape "Créer les tables" du guide.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_OPEN_ID
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "JECI <no-reply@jec-network.local>"